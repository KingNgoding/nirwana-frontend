name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify NMS branch, PR title and commits
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e "if (!/^NMS-\d+[\/-]/.test(process.env.BRANCH) || !/NMS-\d+/.test(process.env.PR_TITLE)) process.exit(1)"
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git log --format=%s "$BASE_SHA..$HEAD_SHA" > /tmp/nms-commits.txt
          node -e "const lines=require('fs').readFileSync('/tmp/nms-commits.txt','utf8').trim().split('\n'); if (lines.some(line=>! /NMS-\d+/.test(line))) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 14
